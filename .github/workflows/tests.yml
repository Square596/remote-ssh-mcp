name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: MCP SDK ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum-v1
            requirement: mcp==1.2.0
          - name: latest-v1
            requirement: mcp>=1.2,<2
          - name: latest-v2
            requirement: mcp>=2,<3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: >-
          uv run --isolated --no-project
          --with-editable .
          --with pytest
          --with pytest-asyncio
          --with '${{ matrix.requirement }}'
          pytest -q

  supported-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} --frozen pytest -q

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .

  terminal-transfer:
    name: Real tmux integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install terminal shells
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Run real tmux transfer tests
        env:
          RSM_RUN_TMUX_TESTS: "1"
        run: uv run --frozen pytest -q tests/test_write_tmux.py

  package:
    name: Built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Import and list tools from wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run --isolated --no-project --with "$wheel" python -c \
            "import asyncio; from remote_ssh_mcp.server import mcp; assert len(asyncio.run(mcp.list_tools())) == 9"

  plugin:
    name: Plugin metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: >-
          uv run --frozen pytest -q
          tests/test_plugin.py
          tests/test_skills.py
          tests/test_versioning.py
